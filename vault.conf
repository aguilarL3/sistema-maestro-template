# vault.conf — gobernanza del vault. VERSIONADO: viaja a todos los clones.
#
# Por qué está versionado y `owner.env` no.
#   owner.env es la IDENTIDAD de la instancia (nombre y correo del dueño) y está
#   gitignoreado, así que NO llega al clon de las demás personas. La gobernanza sí
#   tiene que llegar: si cada quien tuviera su propio modo, cualquiera podría
#   ponerse en `personal` y desactivarse los controles sin que nadie se entere.
#   Es la misma regla —y el mismo motivo— que `repo.conf` en el template de repos
#   de código. Ver 00 Sistema/SOP Proyectos de Código.md §6.1.
#
# Cómo se lee.
#   Se PARSEA, nunca se sourcea. Es un archivo versionado: un `source ./vault.conf`
#   convertiría un PR a este archivo en ejecución de código en la máquina de cada
#   persona, en cada commit.
#   Consecuencia práctica: un comentario va en su PROPIA línea, nunca al final de
#   un valor (`VAULT_MODE=equipo  # ojo` se leería como el valor completo).

# personal | equipo
#   personal → capa multi-persona inerte. Un vault de un solo dueño no paga nada.
#   equipo   → gate de rama en el pre-commit, aviso de PRs al abrir sesión,
#              auto-commit que se abstiene en la rama principal.
VAULT_MODE=personal

# Rama principal: la que el gate protege y la que todos abren en Obsidian.
MAIN_BRANCH=main

# Personas del equipo, separadas por coma. `team-mode.sh` crea 05 Diario/<Persona>/
# para cada una. Solo se usa cuando VAULT_MODE=equipo.
TEAM_MEMBERS=""
